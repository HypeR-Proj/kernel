[package]
name = "hyper-host-tests"
version = "0.0.0"
edition = "2024"
publish = false

[features]
io-dma-revoke-test = ["hyper/io-dma-revoke-test"]

[dependencies]
hyper = { package = "hyper-core", path = "../../core" }
hyper-filesystem = { path = "../../../stdlib/rust/hyper-filesystem" }

[lints.clippy]
expect_used = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[workspace]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }
