[build]
target = "aarch64-unknown-none"

[target.aarch64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tsrc/arch/aarch64/linker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--no-eh-frame-hdr",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "-C", "link-arg=--pack-dyn-relocs=relr",
    "-C", "link-arg=--export-dynamic",
    "-C", "relocation-model=pic",
    "-C", "target-feature=+outline-atomics",
    "-C", "force-frame-pointers=yes",
]

[target.riscv64imac-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tsrc/arch/riscv64/linker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--no-eh-frame-hdr",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "-C", "link-arg=--export-dynamic",
    "-C", "relocation-model=pic",
    "-C", "force-frame-pointers=yes",
]

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tsrc/arch/x86_64/linker.ld",
    "-C", "link-arg=--gc-sections",
    "-C", "link-arg=--no-eh-frame-hdr",
    "-C", "link-arg=-pie",
    "-C", "link-arg=-z",
    "-C", "link-arg=norelro",
    "-C", "link-arg=--pack-dyn-relocs=relr",
    "-C", "link-arg=--export-dynamic",
    "-C", "relocation-model=pic",
    "-C", "force-frame-pointers=yes",
    # Runtime IRQ entry currently preserves the architectural x87/SSE image
    # with FXSAVE. Keep wider vector state disabled until XSAVE is negotiated.
    "-C", "target-feature=-avx,-avx2,-avx512f",
]
