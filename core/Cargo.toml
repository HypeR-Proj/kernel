[package]
name = "hyper-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
path = "../src/lib.rs"
test = false
bench = false
doctest = false

[features]
kernel-self-test = []
kernel-stack-audit = []

[dependencies]
hyper-abi = { path = "../../sdk/abi" }
rustc-demangle = { version = "0.1.28", default-features = false }
fatfs = { path = "../../third_party/rust-fatfs", default-features = false, features = ["lfn", "unicode"] }

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
