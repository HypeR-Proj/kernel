[package]
name = "hyper"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "A modular, Rust-based type-1 hypervisor kernel"
repository = "https://github.com/roolrz/HypeR"
publish = false
autolib = false

[workspace]
members = ["core", "hal"]
exclude = ["tests/host", "tools/kallsyms", "tools/kconfig"]
default-members = [".", "core", "hal"]
resolver = "3"

[features]
default = []
kernel-vgic-tc-test = ["hyper-hal/kernel-vgic-tc-test"]
kernel-self-test = ["hyper/kernel-self-test", "hyper-hal/kernel-self-test"]
kernel-stack-audit = ["hyper/kernel-stack-audit", "hyper-hal/kernel-stack-audit"]

[[bin]]
name = "hyper"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hyper = { package = "hyper-core", path = "core" }
hyper-hal = { path = "hal" }

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.kernel]
inherits = "release"
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = "thin"
opt-level = 2
overflow-checks = true
panic = "abort"
rpath = false
split-debuginfo = "off"
strip = "none"
