[package]
name = "hyper"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "A modular, Rust-based type-1 hypervisor kernel"
repository = "https://github.com/roolrz/HypeR"
publish = false
autolib = false

[package.metadata.hyper]
production-features = ["rtc", "runtime-symbols", "crash-console", "heap-profiling", "pmu-profiling"]

# Defaults are defined by features.default below; Make filters capabilities
# unavailable on its selected architecture without maintaining another list.
[package.metadata.hyper.feature-architectures]
crash-console = ["aarch64"]
pmu-profiling = ["aarch64"]

[workspace]
members = ["core", "hal"]
exclude = ["tests/host", "tests/concurrency", "tools/kallsyms", "tools/kconfig"]
default-members = [".", "core", "hal"]
resolver = "3"

[features]
pmu-profiling = ["hyper-hal/pmu-profiling"]
default = ["rtc", "runtime-symbols", "crash-console"]
rtc = ["hyper/rtc"]
runtime-symbols = ["hyper/runtime-symbols"]
crash-console = ["hyper/crash-console", "hyper-hal/crash-console"]
heap-profiling = ["hyper/heap-profiling"]
kernel-test = ["hyper/kernel-test", "hyper-hal/kernel-test"]
kernel-vgic-tc-test = ["hyper-hal/kernel-vgic-tc-test"]
kernel-self-test = ["hyper/kernel-self-test", "hyper-hal/kernel-self-test"]
kernel-smmuv3-test = ["kernel-self-test"]
io-dma-revoke-test = ["hyper/io-dma-revoke-test"]
kernel-stack-audit = ["hyper/kernel-stack-audit", "hyper-hal/kernel-stack-audit"]

[[bin]]
name = "hyper"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hyper-filesystem = { path = "../stdlib/rust/hyper-filesystem" }
hyper = { package = "hyper-core", path = "core", default-features = false }
hyper-hal = { path = "hal", default-features = false }

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.kernel]
inherits = "release"
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = "thin"
opt-level = 2
overflow-checks = true
panic = "abort"
rpath = false
split-debuginfo = "off"
strip = "none"
