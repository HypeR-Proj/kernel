[package]
name = "hyper"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "A modular, Rust-based type-1 hypervisor kernel"
repository = "https://github.com/roolrz/HypeR"
publish = false
autolib = false

[package.metadata.hyper]
production-features = ["rtc", "runtime-symbols", "crash-console", "heap-profiling", "pmu-profiling", "kernel-trace"]

# Direct Cargo defaults preserve the standalone build. Make resolves the saved
# Kconfig feature menu and passes --no-default-features plus its exact selection.
[package.metadata.hyper.feature-architectures]
crash-console = ["aarch64"]
pmu-profiling = ["aarch64"]

[workspace]
members = ["core", "hal", "platform", "drivers", "vm-models", "trace"]
exclude = ["tests/host", "tests/concurrency", "tools/kallsyms", "tools/kconfig"]
default-members = [".", "core", "hal", "platform", "drivers", "vm-models", "trace"]
resolver = "3"

[features]
kernel-trace = ["hyper-trace/kernel-trace"]
pmu-profiling = ["hyper-hal/pmu-profiling"]
default = ["rtc", "runtime-symbols", "crash-console"]
rtc = ["hyper-drivers/rtc"]
runtime-symbols = ["dep:rustc-demangle"]
crash-console = ["hyper/crash-console", "hyper-hal/crash-console", "hyper-drivers/crash-console"]
heap-profiling = []
kernel-test = ["hyper-hal/kernel-test", "hyper-drivers/kernel-test"]
kernel-vgic-tc-test = ["hyper-hal/kernel-vgic-tc-test"]
kernel-self-test = ["hyper-hal/kernel-self-test"]
kernel-smmuv3-test = ["kernel-self-test"]
io-dma-revoke-test = ["hyper-drivers/io-dma-revoke-test"]
kernel-stack-audit = ["hyper-hal/kernel-stack-audit"]

[[bin]]
name = "hyper"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hyper-filesystem = { path = "../stdlib/rust/hyper-filesystem" }
hyper = { package = "hyper-core", path = "core", default-features = false }
hyper-hal = { path = "hal", default-features = false }
hyper-platform = { path = "platform", default-features = false }
hyper-drivers = { path = "drivers", default-features = false }
hyper-vm-models = { path = "vm-models", default-features = false }
rustc-demangle = { version = "0.1.28", default-features = false, optional = true }
hyper-trace = { path = "trace", default-features = false }

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[profile.kernel]
inherits = "release"
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = "thin"
opt-level = 2
overflow-checks = true
panic = "abort"
rpath = false
split-debuginfo = "off"
strip = "none"
