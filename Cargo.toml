[package]
name = "hyper"
version = "0.1.0"
edition = "2024"
build = "build.rs"
license = "Apache-2.0"
description = "A modular, Rust-based type-1 hypervisor kernel"
repository = "https://github.com/roolrz/HypeR-Kernel"
publish = false

[features]
default = []
host-vm-model-tests = []
kernel-self-test = []

[lib]
test = false
bench = false
doctest = false

[[bin]]
name = "hyper"
path = "src/main.rs"
test = false
bench = false

[dependencies]
hyper-abi = { path = "../sdk/abi" }
rustc-demangle = { version = "0.1.28", default-features = false }

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.kernel]
inherits = "release"
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
lto = "thin"
opt-level = 2
overflow-checks = true
panic = "abort"
rpath = false
split-debuginfo = "off"
strip = "none"
