[package]
name = "hyper-hal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/HypeR-Proj/kernel"
workspace = ".."

[lib]
test = false
bench = false
doctest = false

[features]
pmu-profiling = []
default = []
crash-console = ["hyper/crash-console", "hyper-drivers/crash-console"]
kernel-test = []
kernel-vgic-tc-test = []
kernel-self-test = []
kernel-stack-audit = []

[dependencies]

[dependencies.hyper]
package = "hyper-core"
path = "../core"
default-features = false

[dependencies.hyper-platform]
path = "../platform"
default-features = false

[dependencies.hyper-drivers]
path = "../drivers"
default-features = false

[dependencies.hyper-vm-models]
path = "../vm-models"
default-features = false

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
