[package]
name = "hyper-hal"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
test = false
bench = false
doctest = false

[features]
kernel-self-test = ["hyper/kernel-self-test"]
kernel-stack-audit = ["hyper/kernel-stack-audit"]

[dependencies]
hyper = { package = "hyper-core", path = "../core" }

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
